name: Aktualizacja bazy seriali

on:
  schedule:
    - cron: "17 4 */2 * *"        # co 2 dni o 4:17 UTC (ok. 5:17–6:17 w Polsce)
  workflow_dispatch:               # przycisk „Run workflow” w zakładce Actions
    inputs:
      tryb:
        description: "Tryb aktualizacji"
        type: choice
        default: auto
        options: [auto, zmiany, pelne, tmdb, tylko_strona]

permissions:
  contents: write                  # potrzebne do podmiany plików w Releases
  pages: write                     # publikacja strony na GitHub Pages
  id-token: write                  # wymagane przez actions/deploy-pages

concurrency:
  group: aktualizacja-seriali
  cancel-in-progress: false

env:
  FOLDER: baza-seriali             # folder z projektem bazy w repozytorium
  TAG: dane-seriali                # nazwa wydania w Releases z bazą i stroną

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      strona: ${{ steps.pages.outputs.gotowe }}
    defaults:
      run:
        working-directory: ${{ env.FOLDER }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz aktualną bazę z Releases
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" -p seriale.db --clobber || echo "Brak bazy – zaczynamy od zera."
          else
            echo "Brak wydania '$TAG' – zostanie utworzone."
          fi

      - name: Aktualizuj bazę
        if: ${{ inputs.tryb != 'tylko_strona' }}
        env:
          SA_API_KEY: ${{ secrets.SA_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRYB: ${{ inputs.tryb || 'auto' }}
        run: python skrypty/aktualizuj.py

      - name: Wygeneruj stronę
        if: ${{ always() && hashFiles(format('{0}/seriale.db', env.FOLDER)) != '' }}
        run: python skrypty/generuj_strone.py

      - name: Wyślij bazę i stronę do Releases
        if: ${{ always() && hashFiles(format('{0}/seriale.db', env.FOLDER)) != '' }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Baza seriali i strona" \
              --notes "Plik seriale.html to strona do pobrania. Plik seriale.db to baza danych. Oba są podmieniane przy każdej aktualizacji."
          fi
          gh release upload "$TAG" seriale.db seriale.html --clobber
          # kopia zapasowa bazy raz w miesiącu
          KOPIA="kopia-$(date -u +%Y-%m).db"
          if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$KOPIA"; then
            cp seriale.db "$KOPIA" && gh release upload "$TAG" "$KOPIA"
          fi
          gh release edit "$TAG" --notes "Ostatnia aktualizacja: $(date -u '+%Y-%m-%d %H:%M UTC'). Plik **seriale.html** to strona do pobrania (otwórz w przeglądarce). Plik seriale.db to baza danych SQLite. Pliki kopia-RRRR-MM.db to comiesięczne kopie zapasowe."

      - name: Przygotuj stronę dla GitHub Pages
        id: pages
        if: ${{ always() && hashFiles(format('{0}/seriale.html', env.FOLDER)) != '' }}
        run: |
          rm -rf _site && mkdir _site
          cp seriale.html _site/index.html
          cp login.html _site/login.html
          echo "gotowe=true" >> "$GITHUB_OUTPUT"

      - name: Spakuj stronę dla GitHub Pages
        if: ${{ always() && steps.pages.outputs.gotowe == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.FOLDER }}/_site

  publikuj:
    # Wysyła wygenerowaną stronę na GitHub Pages (Settings → Pages → Source: GitHub Actions).
    needs: aktualizuj
    if: ${{ always() && needs.aktualizuj.outputs.strona == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Opublikuj na GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
